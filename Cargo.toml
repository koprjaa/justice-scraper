[package]
name = "justice-scraper"
version = "1.0.0"
edition = "2021"
authors = ["Jan Alexandr Kopřiva"]
license = "MIT"
description = "Pulls financial statement links and figures from the Czech Justice Registry."

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "charset", "http2", "gzip", "deflate"] }
scraper = "0.24"
roxmltree = "0.21"
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
regex = "1"
unicode-normalization = "0.1"
chrono = "0.4"
rand = "0.9"
pdf-extract = "0.10"
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"

[[bin]]
name = "justice_scraper"
path = "src/bin/justice_scraper.rs"
[[bin]]
name = "batch_scraper"
path = "src/bin/batch_scraper.rs"
[[bin]]
name = "download_pdfs"
path = "src/bin/download_pdfs.rs"
